<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OutreachOps AI</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body class="bg-slate-950 text-slate-100"><div class="max-w-7xl mx-auto p-6"><header class="flex justify-between items-center mb-6"><div><h1 class="text-3xl font-bold">OutreachOps AI</h1><p class="text-slate-400">Multi-Hospital Post-Discharge Operations</p></div><div class="flex gap-2"><input id="user" value="admin" class="bg-slate-900 border border-slate-700 rounded px-3 py-2"><button onclick="login()" class="bg-indigo-600 px-4 py-2 rounded">Login</button></div></header><div id="msg" class="mb-4 text-amber-300"></div><section class="grid md:grid-cols-4 gap-4" id="cards"></section><div class="grid lg:grid-cols-2 gap-6 mt-6"><section class="bg-slate-900 rounded-xl p-5"><div class="flex justify-between"><h2 class="text-xl font-semibold">Campaigns</h2><button onclick="createCampaign()" class="bg-emerald-600 px-3 py-1 rounded">Create & Start</button></div><div id="campaigns" class="mt-4 space-y-2"></div></section><section class="bg-slate-900 rounded-xl p-5"><div class="flex justify-between"><h2 class="text-xl font-semibold">Queue</h2><button onclick="schedule()" class="bg-indigo-600 px-3 py-1 rounded">Schedule</button></div><div id="queue" class="mt-4 overflow-auto max-h-96"></div></section></div><div class="grid lg:grid-cols-2 gap-6 mt-6"><section class="bg-slate-900 rounded-xl p-5"><h2 class="text-xl font-semibold">Escalations</h2><div id="esc" class="mt-4 space-y-3"></div></section><section class="bg-slate-900 rounded-xl p-5"><h2 class="text-xl font-semibold">Safety Evaluation</h2><button onclick="evaluateSafety()" class="bg-rose-600 px-3 py-2 rounded mt-3">Run Evaluation</button><pre id="eval" class="text-xs mt-3 whitespace-pre-wrap text-slate-300"></pre></section></div><section class="bg-slate-900 rounded-xl p-5 mt-6"><h2 class="text-xl font-semibold">Patient Call Simulator</h2><p class="text-slate-400 text-sm">Pick a queued/calling task and simulate outcomes.</p><div class="flex gap-2 mt-3"><select id="task" class="bg-slate-800 p-2 rounded"></select><select id="outcome" class="bg-slate-800 p-2 rounded"><option>ROUTINE</option><option>CONCERNING</option><option>URGENT</option><option>NO_ANSWER</option><option>BUSY</option><option>DROPPED</option><option>CALLBACK</option></select><button onclick="simulate()" class="bg-amber-600 px-4 py-2 rounded">Simulate Call</button></div><pre id="sim" class="mt-4 text-sm text-slate-300"></pre></section></div><script>
let token='admin'; const api=p=>fetch(p,{headers:{Authorization:'Bearer '+token}}); async function login(){token=document.getElementById('user').value;load()}; async function j(p,o={}){o.headers={...(o.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};let r=await fetch(p,o);let text=await r.text();let x;try{x=text?JSON.parse(text):{}}catch(_){x={detail:text||('HTTP '+r.status)}}if(!r.ok)throw Error(x.detail||x.message||('HTTP '+r.status));return x}
async function load(){try{let d=await j('/api/dashboard');document.getElementById('cards').innerHTML=d.hospitals.map(h=>`<div class="bg-slate-900 p-4 rounded-xl"><div class="text-slate-400 text-sm">${h.hospital}</div><div class="text-2xl font-bold">${h.active_calls}/${h.capacity}</div><div class="text-xs">active calls · ${h.pending} pending · ${h.escalated} escalated</div></div>`).join('');let cs=await j('/api/campaigns');document.getElementById('campaigns').innerHTML=cs.map(c=>`<div class="border border-slate-700 p-3 rounded flex justify-between"><span>${c.name}</span><span class="text-xs">${c.status}</span></div>`).join('');await refreshQueue();let es=await j('/api/escalations');document.getElementById('esc').innerHTML=es.map(e=>`<div class="border border-slate-700 rounded p-3"><div><b>${e.patient_id}</b> · ${e.priority} · ${e.status}</div><pre class="text-xs mt-2 whitespace-pre-wrap">${JSON.stringify(e.evidence,null,2)}</pre>${e.status==='OPEN'?`<button onclick="resolveE(${e.id})" class="bg-emerald-700 px-2 py-1 rounded mt-2">Resolve</button>`:''}</div>`).join('')}catch(e){document.getElementById('msg').textContent=e.message}}
async function refreshQueue(){let q=await j('/api/queue');document.getElementById('queue').innerHTML='<table class="w-full text-sm"><tr class="text-slate-400"><th>Patient</th><th>Risk</th><th>State</th><th>Priority</th><th>Attempts</th></tr>'+q.map(x=>`<tr class="border-t border-slate-800"><td>${x.patient_id}</td><td>${x.risk}</td><td>${x.state}</td><td>${x.priority}</td><td>${x.attempts}</td></tr>`).join('')+'</table>';document.getElementById('task').innerHTML=q.filter(x=>['CALLING','PENDING','RETRY_SCHEDULED'].includes(x.state)).map(x=>`<option value="${x.id}">${x.patient_id} · ${x.state}</option>`).join('')}
async function createCampaign(){try{let h=(await j('/api/hospitals'))[0];let cs=await j('/api/campaigns');let existing=cs.find(c=>c.hospital_id===h.id&&c.status==='RUNNING');if(existing){document.getElementById('msg').textContent='A campaign is already running. Use Schedule to fill the queue.';return load()}let ready=cs.find(c=>c.hospital_id===h.id&&c.status==='READY');let c=ready?ready:await j('/api/campaigns',{method:'POST',body:JSON.stringify({hospital_id:h.id,name:'Post-Discharge Demo Campaign',priority:70,max_attempts:3})});await j('/api/campaigns/'+c.id+'/start',{method:'POST'});document.getElementById('msg').textContent='Campaign started. Now click Schedule.';load()}catch(e){document.getElementById('msg').textContent=e.message}};async function schedule(){try{let r=await j('/api/queue/schedule',{method:'POST'});document.getElementById('msg').textContent='Scheduled '+r.scheduled.length+' call(s).';load()}catch(e){document.getElementById('msg').textContent=e.message}};async function simulate(){try{let id=document.getElementById('task').value;if(!id){document.getElementById('msg').textContent='No task is available. Start a campaign and click Schedule first.';return}let x=await j('/api/tasks/'+id+'/simulate',{method:'POST',body:JSON.stringify({outcome:document.getElementById('outcome').value})});document.getElementById('sim').textContent=JSON.stringify(x,null,2);load()}catch(e){document.getElementById('msg').textContent=e.message}};async function resolveE(id){let r=prompt('Enter human follow-up/resolution');if(r)await j('/api/escalations/'+id+'/resolve',{method:'POST',body:JSON.stringify({resolution:r})});load()};async function evaluateSafety(){let x=await j('/api/evaluation/run',{method:'POST'});document.getElementById('eval').textContent=JSON.stringify(x,null,2)}load();
</script></body></html>
